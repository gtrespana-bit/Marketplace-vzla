<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="leftShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26050e" stop-opacity="0.99"/>
      <stop offset="0.48" stop-color="#3d0a19" stop-opacity="0.91"/>
      <stop offset="0.73" stop-color="#3d0a19" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3d0a19" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.58" stop-color="#180309" stop-opacity="0"/>
      <stop offset="1" stop-color="#180309" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="ctaGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d36d"/>
      <stop offset="1" stop-color="#c9a84c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.31"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <clipPath id="logoClip"><rect x="70" y="54" width="86" height="86" rx="19"/></clipPath>
  </defs>

  <rect width="1080" height="1350" fill="#3b0916"/>
  <image x="0" y="0" width="1080" height="1350" xlink:href="assets/product-cluster.png" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1080" height="1350" fill="url(#leftShade)"/>
  <rect width="1080" height="1350" fill="url(#bottomShade)"/>

  <!-- Marca -->
  <g filter="url(#shadow)">
    <rect x="64" y="48" width="420" height="99" rx="25" fill="#ffffff" fill-opacity="0.97"/>
    <image x="70" y="54" width="86" height="86" xlink:href="../../public/logo-vendet.webp" preserveAspectRatio="xMidYMid slice" clip-path="url(#logoClip)"/>
    <text x="176" y="112" font-family="DejaVu Sans, Arial, sans-serif" font-size="52" font-weight="700" fill="#6f1930" letter-spacing="-2">Vende<tspan fill="#c9a84c">T</tspan></text>
    <text x="178" y="136" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#5e5260" letter-spacing="2.1">MARKETPLACE VENEZOLANO</text>
  </g>

  <!-- Categoría de anuncio -->
  <g transform="translate(70 187)">
    <rect width="358" height="46" rx="23" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25"/>
    <circle cx="26" cy="23" r="8" fill="#f2ca5b"/>
    <text x="48" y="30" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="1.1">COMPRA • VENDE • CONECTA</text>
  </g>

  <!-- Gancho -->
  <g font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" filter="url(#textShadow)">
    <text x="67" y="336" font-size="82" fill="#f2ca5b" letter-spacing="-3.2">VENEZUELA</text>
    <text x="67" y="429" font-size="84" fill="#ffffff" letter-spacing="-3.2">YA TIENE</text>
    <text x="67" y="522" font-size="83" fill="#ffffff" letter-spacing="-3.2">SU PROPIO</text>
    <text x="67" y="608" font-size="67" fill="#f2ca5b" letter-spacing="-2.7">MARKETPLACE.</text>
  </g>

  <!-- Propuesta de valor -->
  <text x="71" y="684" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Compra y vende entre venezolanos.</text>
  <text x="71" y="725" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#f3e7eb">Directo, local y sin comisión.</text>

  <!-- Beneficios localizados -->
  <g font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700">
    <g transform="translate(70 783)">
      <rect width="286" height="54" rx="15" fill="#ffffff" fill-opacity="0.95"/>
      <circle cx="28" cy="27" r="13" fill="#7b2d3b"/>
      <path d="M21 27l5 5 10-12" fill="none" stroke="#ffffff" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="51" y="34" fill="#32101a">PRECIOS EN $ + BS.</text>
    </g>
    <g transform="translate(70 850)">
      <rect width="292" height="54" rx="15" fill="#ffffff" fill-opacity="0.95"/>
      <circle cx="28" cy="27" r="13" fill="#7b2d3b"/>
      <path d="M21 27l5 5 10-12" fill="none" stroke="#ffffff" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="51" y="34" fill="#32101a">CHAT + WHATSAPP</text>
    </g>
    <g transform="translate(70 917)">
      <rect width="259" height="54" rx="15" fill="#ffffff" fill-opacity="0.95"/>
      <circle cx="28" cy="27" r="13" fill="#7b2d3b"/>
      <path d="M21 27l5 5 10-12" fill="none" stroke="#ffffff" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="51" y="34" fill="#32101a">TODO EL PAÍS</text>
    </g>
  </g>

  <!-- CTA -->
  <g filter="url(#shadow)">
    <rect x="70" y="1058" width="396" height="89" rx="23" fill="url(#ctaGold)"/>
    <text x="268" y="1115" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#4a1020">ENTRA GRATIS  →</text>
  </g>
  <text x="72" y="1203" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="700" fill="#ffffff">vendet.online</text>
  <text x="73" y="1241" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#e8dbe0">Publicar siempre es gratis · Destacar es opcional</text>

  <!-- Firma cromática venezolana -->
  <rect x="0" y="1332" width="360" height="18" fill="#f4cf66"/>
  <rect x="360" y="1332" width="360" height="18" fill="#174ea6"/>
  <rect x="720" y="1332" width="360" height="18" fill="#cf142b"/>
</svg>
