<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="leftShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22040c" stop-opacity="0.99"/>
      <stop offset="0.48" stop-color="#3d0b18" stop-opacity="0.91"/>
      <stop offset="0.74" stop-color="#3d0b18" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3d0b18" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.60" stop-color="#190309" stop-opacity="0"/>
      <stop offset="1" stop-color="#190309" stop-opacity="0.83"/>
    </linearGradient>
    <linearGradient id="ctaGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d36d"/>
      <stop offset="1" stop-color="#c9a84c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <clipPath id="logoClip"><rect x="70" y="54" width="86" height="86" rx="19"/></clipPath>
  </defs>

  <rect width="1080" height="1350" fill="#3b0916"/>
  <image x="0" y="0" width="1080" height="1350" xlink:href="assets/photo-first-man.png" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1080" height="1350" fill="url(#leftShade)"/>
  <rect width="1080" height="1350" fill="url(#bottomShade)"/>

  <!-- Marca -->
  <g filter="url(#shadow)">
    <rect x="64" y="48" width="420" height="99" rx="25" fill="#ffffff" fill-opacity="0.97"/>
    <image x="70" y="54" width="86" height="86" xlink:href="../../public/logo-vendet.webp" preserveAspectRatio="xMidYMid slice" clip-path="url(#logoClip)"/>
    <text x="176" y="112" font-family="DejaVu Sans, Arial, sans-serif" font-size="52" font-weight="700" fill="#6f1930" letter-spacing="-2">Vende<tspan fill="#c9a84c">T</tspan></text>
    <text x="178" y="136" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#5e5260" letter-spacing="2.1">MARKETPLACE VENEZOLANO</text>
  </g>

  <!-- Sello Venezuela -->
  <g transform="translate(70 187)">
    <rect width="354" height="46" rx="23" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25"/>
    <rect x="14" y="11" width="36" height="8" rx="4" fill="#f4cf66"/>
    <rect x="14" y="19" width="36" height="8" rx="4" fill="#174ea6"/>
    <rect x="14" y="27" width="36" height="8" rx="4" fill="#cf142b"/>
    <text x="63" y="30" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="1.1">VENDE EN VENEZUELA</text>
  </g>

  <!-- Gancho -->
  <g font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" filter="url(#textShadow)">
    <text x="66" y="354" font-size="116" fill="#ffffff" letter-spacing="-4.5">FOTO.</text>
    <text x="66" y="478" font-size="108" fill="#f2ca5b" letter-spacing="-4.5">PRECIO.</text>
    <text x="66" y="589" font-size="79" fill="#ffffff" letter-spacing="-3.5">¡PUBLICADO!</text>
  </g>

  <!-- Propuesta de valor -->
  <text x="71" y="680" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" fill="#ffffff">Tu anuncio listo en</text>
  <text x="71" y="724" font-family="DejaVu Sans, Arial, sans-serif" font-size="33" font-weight="700" fill="#f2ca5b">menos de 2 minutos.</text>

  <!-- Beneficios -->
  <g transform="translate(70 784)" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700">
    <rect width="436" height="162" rx="23" fill="#ffffff" fill-opacity="0.94"/>
    <circle cx="35" cy="38" r="14" fill="#1f9d64"/>
    <path d="M28 38l5 5 10-12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="61" y="45" fill="#32101a">PUBLICACIÓN GRATIS</text>
    <circle cx="35" cy="81" r="14" fill="#1f9d64"/>
    <path d="M28 81l5 5 10-12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="61" y="88" fill="#32101a">0% COMISIÓN POR VENTA</text>
    <circle cx="35" cy="124" r="14" fill="#1f9d64"/>
    <path d="M28 124l5 5 10-12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="61" y="131" fill="#32101a">CONTACTO DIRECTO</text>
  </g>

  <!-- CTA -->
  <g filter="url(#shadow)">
    <rect x="70" y="1038" width="384" height="89" rx="23" fill="url(#ctaGold)"/>
    <text x="262" y="1095" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" fill="#4a1020">VENDE HOY  →</text>
  </g>
  <text x="72" y="1188" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="700" fill="#ffffff">vendet.online</text>
  <text x="73" y="1226" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#e8dbe0">Crea tu cuenta gratis y publica ahora</text>

  <!-- Firma cromática venezolana -->
  <rect x="0" y="1332" width="360" height="18" fill="#f4cf66"/>
  <rect x="360" y="1332" width="360" height="18" fill="#174ea6"/>
  <rect x="720" y="1332" width="360" height="18" fill="#cf142b"/>
</svg>
