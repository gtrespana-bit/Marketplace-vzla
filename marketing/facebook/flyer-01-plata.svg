<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="leftShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#27060f" stop-opacity="0.98"/>
      <stop offset="0.48" stop-color="#3f0d1b" stop-opacity="0.90"/>
      <stop offset="0.72" stop-color="#3f0d1b" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#3f0d1b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.58" stop-color="#1d050b" stop-opacity="0"/>
      <stop offset="1" stop-color="#1d050b" stop-opacity="0.76"/>
    </linearGradient>
    <linearGradient id="ctaGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4cf66"/>
      <stop offset="1" stop-color="#c9a84c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <clipPath id="logoClip"><rect x="70" y="54" width="86" height="86" rx="19"/></clipPath>
  </defs>

  <rect width="1080" height="1350" fill="#3d0b18"/>
  <image x="0" y="0" width="1080" height="1350" xlink:href="assets/seller-woman.png" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1080" height="1350" fill="url(#leftShade)"/>
  <rect width="1080" height="1350" fill="url(#bottomShade)"/>

  <!-- Marca -->
  <g filter="url(#shadow)">
    <rect x="64" y="48" width="420" height="99" rx="25" fill="#ffffff" fill-opacity="0.97"/>
    <image x="70" y="54" width="86" height="86" xlink:href="../../public/logo-vendet.webp" preserveAspectRatio="xMidYMid slice" clip-path="url(#logoClip)"/>
    <text x="176" y="112" font-family="DejaVu Sans, Arial, sans-serif" font-size="52" font-weight="700" fill="#6f1930" letter-spacing="-2">Vende<tspan fill="#c9a84c">T</tspan></text>
    <text x="178" y="136" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#5e5260" letter-spacing="2.1">MARKETPLACE VENEZOLANO</text>
  </g>

  <!-- Sello Venezuela -->
  <g transform="translate(70 186)">
    <rect width="372" height="48" rx="24" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.24"/>
    <rect x="14" y="12" width="38" height="8" rx="4" fill="#f4cf66"/>
    <rect x="14" y="20" width="38" height="8" rx="4" fill="#174ea6"/>
    <rect x="14" y="28" width="38" height="8" rx="4" fill="#cf142b"/>
    <text x="66" y="31" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="1.3">HECHO PARA VENEZUELA</text>
  </g>

  <!-- Gancho -->
  <g font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" filter="url(#textShadow)">
    <text x="68" y="344" font-size="84" fill="#ffffff" letter-spacing="-3">ESO QUE</text>
    <text x="68" y="438" font-size="92" fill="#f2ca5b" letter-spacing="-4">NO USAS</text>
    <text x="68" y="532" font-size="82" fill="#ffffff" letter-spacing="-3">PUEDE SER</text>
    <text x="68" y="638" font-size="108" fill="#f2ca5b" letter-spacing="-5">PLATA.</text>
  </g>

  <!-- Propuesta de valor -->
  <text x="72" y="712" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Publícalo gratis en VendeT.</text>
  <text x="72" y="756" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" fill="#f4e9ed">Sin comisión. Tú recibes el 100%.</text>

  <!-- Beneficios -->
  <g font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700">
    <g transform="translate(70 808)">
      <rect width="260" height="57" rx="15" fill="#ffffff" fill-opacity="0.95"/>
      <circle cx="29" cy="28.5" r="14" fill="#1f9d64"/>
      <path d="M22 29l5 5 10-12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="53" y="36" fill="#32101a">PUBLICAR: $0</text>
    </g>
    <g transform="translate(70 879)">
      <rect width="280" height="57" rx="15" fill="#ffffff" fill-opacity="0.95"/>
      <circle cx="29" cy="28.5" r="14" fill="#1f9d64"/>
      <path d="M22 29l5 5 10-12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="53" y="36" fill="#32101a">COMISIÓN: 0%</text>
    </g>
  </g>

  <!-- CTA -->
  <g filter="url(#shadow)">
    <rect x="70" y="1047" width="448" height="92" rx="24" fill="url(#ctaGold)"/>
    <text x="294" y="1106" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" fill="#4a1020" letter-spacing="0.6">PUBLICA HOY  →</text>
  </g>
  <text x="72" y="1196" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="700" fill="#ffffff" letter-spacing="0.4">vendet.online</text>
  <text x="73" y="1234" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#e8dbe0">Foto · precio · listo en menos de 2 minutos</text>

  <!-- Firma cromática venezolana -->
  <rect x="0" y="1332" width="360" height="18" fill="#f4cf66"/>
  <rect x="360" y="1332" width="360" height="18" fill="#174ea6"/>
  <rect x="720" y="1332" width="360" height="18" fill="#cf142b"/>
</svg>
